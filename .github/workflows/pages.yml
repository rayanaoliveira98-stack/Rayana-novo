name: Deploy LumiLínguas (GitHub Pages)

on:
  push:
    branches:
      - main
      - "claude/lumilínguas-multilingual-app-9e87wu"
    paths:
      - "lumilinguas/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes (SRS, sessão, portão parental, packs)
        run: cd lumilinguas && node --test tests/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar/configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar a pasta do aplicativo
        uses: actions/upload-pages-artifact@v3
        with:
          path: lumilinguas
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
