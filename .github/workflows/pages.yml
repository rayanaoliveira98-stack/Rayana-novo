name: Deploy LumiLínguas (GitHub Pages)

# Publica a pasta lumilinguas/ no branch gh-pages (o GitHub Pages serve esse
# branch). Método clássico: não exige a permissão de criação de site do Pages,
# que o token padrão do workflow não possui neste repositório.

on:
  push:
    branches:
      - main
      - "claude/lumilínguas-multilingual-app-9e87wu"
    paths:
      - "lumilinguas/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes (SRS, sessão, portão parental, packs)
        run: cd lumilinguas && node --test tests/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar no branch gh-pages
        run: |
          cd lumilinguas
          rm -rf dist node_modules
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy LumiLínguas (${GITHUB_SHA})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
