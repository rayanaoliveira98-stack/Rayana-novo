<style>
/* LumiLínguas — Sistema visual.
 * Alegre, acolhedor e acessível: elementos grandes, alto contraste,
 * pouco texto na área infantil, animações que explicam a atividade.
 * Identidade por idioma via --lang-color / --lang-soft (personagem + cor,
 * nunca só cor — acessível para daltonismo).
 */

:root {
  --ink: #2E2A45;
  --paper: #FFF9F2;
  --card: #FFFFFF;
  --accent: #8E6CF0;
  --accent-soft: #EAE3FC;
  --good: #2BB673;
  --danger: #E2574C;
  --radius-l: 28px;
  --radius-m: 18px;
  --shadow: 0 6px 24px rgba(46, 42, 69, .12);
  --lang-color: #8E6CF0;
  --lang-soft: #EAE3FC;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: 'Nunito', 'Comic Sans MS', -apple-system, 'Segoe UI', sans-serif;
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- telas ---------- */

.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.screen.active { display: flex; }
.parent-ui { overflow-y: auto; user-select: text; -webkit-user-select: text; }

.screen-top {
  display: flex; align-items: center; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) 16px 8px;
}

/* ---------- botões básicos ---------- */

button { font-family: inherit; border: 0; cursor: pointer; color: var(--ink); }

.btn-round {
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--card); box-shadow: var(--shadow);
  font-size: 34px; display: inline-flex; align-items: center; justify-content: center;
  transition: transform .15s ease;
}
.btn-round:active { transform: scale(.92); }
.btn-round.small { width: 48px; height: 48px; font-size: 20px; }

.btn-primary {
  background: var(--accent); color: #fff;
  font-size: 18px; font-weight: 700;
  padding: 14px 28px; border-radius: var(--radius-m);
  box-shadow: var(--shadow);
}
.btn-primary:disabled { opacity: .4; cursor: default; }
.btn-ghost {
  background: var(--accent-soft); color: var(--ink);
  font-size: 15px; font-weight: 600; padding: 10px 18px; border-radius: var(--radius-m);
  margin: 4px 6px 4px 0;
}
.btn-danger { background: #FBE3E1; color: var(--danger); font-weight: 700; padding: 12px 20px; border-radius: var(--radius-m); margin-top: 10px; display: block; }

/* ---------- splash ---------- */

.splash-inner {
  margin: auto; text-align: center; padding: 24px; max-width: 480px; width: 100%;
}
.logo h1 { font-size: 42px; letter-spacing: -1px; background: linear-gradient(90deg, #8E6CF0, #E2574C, #F4B400); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-star { font-size: 40px; }
.tagline { color: #6B6584; margin-top: 6px; font-size: 15px; }
.profile-list { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 36px 0; }
.profile-bubble {
  background: var(--card); border-radius: var(--radius-l); box-shadow: var(--shadow);
  padding: 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform .15s ease;
}
.profile-bubble:active { transform: scale(.94); }
.pb-emoji { font-size: 64px; }
.pb-name { font-size: 20px; font-weight: 800; }
.splash-empty { margin: 30px 0; color: #6B6584; font-size: 15px; }
.btn-parent-link { background: none; color: #6B6584; font-size: 14px; text-decoration: underline; margin-top: 16px; }

/* ---------- casa da criança ---------- */

.home-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 18px 0;
}
.day-pill { background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 16px; box-shadow: var(--shadow); }
.home-center { margin: auto; text-align: center; }
.home-char-wrap {
  width: 210px; height: 210px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 30px; box-shadow: var(--shadow);
}
.home-char { font-size: 120px; animation: floaty 3s ease-in-out infinite; }
.btn-play {
  width: 120px; height: 120px; border-radius: 50%;
  background: linear-gradient(135deg, #2BB673, #37cf87); color: #fff;
  font-size: 52px; box-shadow: 0 10px 30px rgba(43, 182, 115, .45);
  animation: pulse 2.2s ease-in-out infinite;
}
.home-nav { display: flex; gap: 26px; justify-content: center; padding-bottom: 14px; }
.home-nav-btn { width: 84px; height: 84px; border-radius: 26px; background: var(--card); box-shadow: var(--shadow); font-size: 40px; }
.stickers-preview { text-align: center; font-size: 26px; padding-bottom: max(18px, env(safe-area-inset-bottom)); min-height: 40px; }

@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- mapa ---------- */

.map-path {
  flex: 1; overflow-y: auto; padding: 20px 28px 60px;
  display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start; justify-content: center;
}
.map-dot {
  width: 56px; height: 56px; border-radius: 50%;
  background: #fff; border: 4px solid var(--wk-color, #ccc);
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  opacity: .55;
}
.map-dot.done { opacity: 1; background: var(--wk-color); }
.map-dot.current { opacity: 1; animation: pulse 1.6s ease-in-out infinite; border-width: 5px; }
.map-week-badge { width: 100%; text-align: center; font-size: 34px; padding: 6px 0; }

/* ---------- adesivos ---------- */

.sticker-grid { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 20px; padding: 24px; justify-content: center; align-content: flex-start; }
.sticker {
  width: 96px; height: 96px; border-radius: 24px; background: var(--card); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center; font-size: 54px;
  animation: pop .4s ease;
}
.sticker.ghost { opacity: .25; }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }

/* ---------- sessão ---------- */

.session-top { display: flex; align-items: center; gap: 14px; padding: max(12px, env(safe-area-inset-top)) 16px 4px; }
.progress-track { flex: 1; height: 12px; background: #EDE7DE; border-radius: 999px; overflow: hidden; }
.progress-track.ob { margin: max(14px, env(safe-area-inset-top)) 20px 0; flex: none; }
.progress-fill { height: 100%; width: 0; background: var(--lang-color, var(--accent)); border-radius: 999px; transition: width .5s ease; }

.session-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 12px 18px calc(24px + env(safe-area-inset-bottom)); overflow: hidden;
}

.stage-card {
  background: var(--card); border-radius: var(--radius-l); box-shadow: var(--shadow);
  padding: 28px 34px; text-align: center; max-width: 420px; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative;
}
.hero-emoji { font-size: 110px; line-height: 1.15; }
.hero-emoji.hero-small { font-size: 72px; }
.bounce { animation: bounceIn .6s ease; }
@keyframes bounceIn { 0% { transform: scale(.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

.word-label { font-size: 26px; font-weight: 800; color: var(--lang-color); }
.task-hint { font-size: 40px; animation: floaty 2.4s ease-in-out infinite; }

.alt-dots { display: flex; gap: 10px; }
.alt-dot {
  width: 52px; height: 52px; border-radius: 14px; background: #F4F0FB; font-size: 26px;
  border: 3px solid transparent;
}
.alt-dot.active { border-color: var(--lang-color); background: #fff; }

.replay-bar { display: flex; gap: 16px; }
.btn-replay, .btn-slow { background: var(--lang-soft); }

.btn-next {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--lang-color); color: #fff; font-size: 44px;
  box-shadow: var(--shadow); animation: pulse 2s ease-in-out infinite;
}

.options { display: grid; gap: 18px; width: 100%; max-width: 460px; }
.options-2 { grid-template-columns: 1fr 1fr; }
.options-3 { grid-template-columns: 1fr 1fr 1fr; }
.options-4 { grid-template-columns: 1fr 1fr; }
.option-card {
  background: var(--card); border-radius: var(--radius-l); box-shadow: var(--shadow);
  border: 4px solid transparent; padding: 18px 8px; min-height: 110px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  transition: transform .15s ease, opacity .3s ease;
}
.option-card:active { transform: scale(.94); }
.opt-emoji { font-size: 64px; }
.option-card.correct { border-color: var(--good); animation: pop .35s ease; }
.option-card.faded { opacity: .35; }
.option-card.reveal { border-color: var(--good); animation: pulse 1s ease-in-out 2; }
.char-card .char-name { font-size: 18px; font-weight: 800; }
.char-name.big { font-size: 26px; font-weight: 800; }

/* cena "encontre o objeto" */
.scene {
  position: relative; width: min(92vw, 440px); height: 320px;
  background: linear-gradient(#DCEFFB 60%, #DFF5EA 60%); border-radius: var(--radius-l); box-shadow: var(--shadow);
}
.scene-bg { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; font-size: 130px; opacity: .28; }
.scene-item {
  position: absolute; background: none; font-size: 52px; transition: opacity .3s ease, transform .15s ease;
}
.scene-item:active { transform: scale(1.15); }
.scene-item.correct { animation: pop .4s ease; }
.scene-item.faded { opacity: .3; }
.pos-0 { left: 8%; top: 10%; } .pos-1 { right: 10%; top: 14%; }
.pos-2 { left: 14%; bottom: 14%; } .pos-3 { right: 16%; bottom: 10%; }
.pos-4 { left: 42%; top: 6%; } .pos-5 { left: 44%; bottom: 6%; }

/* memória / desapareceu */
.memory-row { display: flex; gap: 16px; }
.memory-card {
  width: 96px; height: 96px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center; font-size: 54px;
  transition: transform .4s ease;
}
.memory-card.covered { background: var(--lang-soft); }

/* arrastar */
.drop-zone {
  width: 150px; height: 150px; border: 5px dashed var(--lang-color); border-radius: var(--radius-l);
  display: flex; align-items: center; justify-content: center; background: #fff;
}
.drop-zone .ghost { font-size: 72px; opacity: .22; }
.drop-zone .landed { font-size: 84px; animation: pop .4s ease; }
.drag-row { display: flex; gap: 22px; }
.drag-item {
  width: 96px; height: 96px; border-radius: 24px; background: var(--card); box-shadow: var(--shadow);
  font-size: 56px; touch-action: none; position: relative; z-index: 5;
}
.drag-item.dragging { z-index: 10; box-shadow: 0 14px 30px rgba(46,42,69,.25); }
.drag-item.faded { opacity: .35; }

/* microfone */
.btn-mic {
  width: 104px; height: 104px; border-radius: 50%;
  background: var(--lang-color); color: #fff; font-size: 46px; box-shadow: var(--shadow);
}
.btn-mic.listening { animation: pulse 1s ease-in-out infinite; box-shadow: 0 0 0 12px var(--lang-soft); }
.btn-mic:disabled { opacity: .5; }
.btn-said {
  width: 104px; height: 104px; border-radius: 50%;
  background: var(--good); color: #fff; font-size: 46px; box-shadow: var(--shadow);
}
.mic-status { font-size: 22px; min-height: 28px; }

/* elogio */
.praise-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(255, 249, 242, .6); opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 50;
}
.praise-overlay.show { opacity: 1; }
.praise-star { font-size: 130px; animation: pop .5s ease; }

/* celebração */
.celebrate-card { overflow: hidden; min-height: 260px; justify-content: center; }
.confetti {
  position: absolute; top: -12px; width: 12px; height: 12px; border-radius: 3px;
  animation: fall 1.8s linear infinite;
}
@keyframes fall { to { transform: translateY(320px) rotate(540deg); } }
.welcome-card, .lang-intro { min-width: 260px; }

/* ---------- onboarding / painel ---------- */

.onboarding-body { max-width: 560px; width: 100%; margin: 0 auto; padding: 26px 22px 60px; }
.onboarding-body h2 { font-size: 26px; margin-bottom: 14px; }
.onboarding-body label { display: block; margin: 18px 0 8px; font-weight: 700; font-size: 15px; }
.ob-input {
  width: 100%; font-size: 18px; padding: 14px 16px; border-radius: var(--radius-m);
  border: 2px solid #E3DCD2; background: #fff; font-family: inherit;
}
.ob-note { color: #6B6584; font-size: 14px; line-height: 1.55; margin: 10px 0; }
.ob-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
.ob-nav .btn-primary { margin-left: auto; }

.chip-row { display: flex; gap: 10px; flex-wrap: wrap; }
.chip-row.chip-col { flex-direction: column; align-items: flex-start; }
.chip {
  background: #fff; border: 2px solid #E3DCD2; border-radius: 999px;
  padding: 10px 18px; font-size: 15px; font-weight: 700;
}
.chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.chip-emoji { font-size: 24px; padding: 8px 14px; }
.chip.toggle { display: block; margin: 8px 0; text-align: left; border-radius: var(--radius-m); width: 100%; }

.lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 8px; }
.lang-card {
  background: #fff; border: 3px solid #E3DCD2; border-radius: var(--radius-m);
  padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 700;
}
.lang-card.sel { border-color: var(--lang-color, var(--accent)); background: #FBF8FF; }
.lang-card.disabled { opacity: .45; cursor: default; }
.lc-flag { font-size: 30px; }
.lc-char { font-size: 13px; color: #6B6584; }
.lc-soon { font-size: 11px; color: var(--danger); font-weight: 800; text-transform: uppercase; }

.minitest-area { margin: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }

.parent-title { font-size: 20px; }
.parent-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; }
.ptab {
  background: #fff; border: 2px solid #E3DCD2; border-radius: 999px;
  padding: 8px 16px; font-size: 14px; font-weight: 700; white-space: nowrap;
}
.ptab.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.parent-body { padding: 12px 16px 60px; max-width: 640px; margin: 0 auto; width: 100%; }
.pcard {
  background: #fff; border-radius: var(--radius-m); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 14px;
}
.pcard h3 { margin-bottom: 10px; font-size: 17px; }
.pcard p { font-size: 14px; line-height: 1.6; margin: 4px 0; }
.pcard.tip { font-size: 15px; }
.state-line { color: #6B6584; }
.voice-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
.voice-word { flex: 1; font-size: 15px; min-width: 140px; }

/* ---------- portão parental ---------- */

.gate-modal {
  position: fixed; inset: 0; background: rgba(46, 42, 69, .5);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.gate-modal.open { display: flex; }
.gate-card {
  background: #fff; border-radius: var(--radius-l); padding: 30px; max-width: 360px; width: 100%;
  position: relative; text-align: center;
}
.gate-card p { margin: 8px 0; }
.gate-title { font-size: 20px; font-weight: 800; }
.gate-input {
  font-size: 28px; text-align: center; letter-spacing: 8px; width: 180px;
  padding: 10px; border-radius: var(--radius-m); border: 2px solid #E3DCD2; margin: 12px 0; font-family: inherit;
}
.gate-msg { color: var(--danger); min-height: 20px; font-size: 14px; }
.gate-x { position: absolute; top: 12px; right: 12px; }
.gate-card .btn-primary { margin-top: 8px; }

/* ---------- acessibilidade ---------- */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (min-width: 700px) {
  .session-stage { padding-bottom: 40px; }
  .hero-emoji { font-size: 140px; }
}

</style>

 * Módulo puro, sem DOM: roda no navegador e no Node (testes).
 *
 * Cada combinação criança+conceito+idioma tem um registro:
 * {
 *   state: 'new'|'presented'|'recognized'|'repeated_helped'|'spoken'|'mastered'|'review',
 *   introducedAt, lastSeenAt, dueAt        — timestamps (ms)
 *   intervalIndex                          — posição em INTERVALS
 *   streak, struggles                      — acertos seguidos / dificuldades acumuladas
 *   struggleDays                           — dias distintos com dificuldade (>=3 → simplificar)
 *   lastResult: 'ok'|'hard'|null
 * }

 * — revisões após 1, 3, 7, 14 e 30 dias;
 * — dificuldade nunca é punida: apenas reagenda mais cedo e marca para revisão;

/* LumiLínguas — Montador da sessão diária (~11 min), adaptativo.
 * Módulo puro (sem DOM): recebe perfil + registros SRS e devolve a fila de
 * passos que o app executa. Testável em Node.
 *
 * Ciclo diário implementado:
 * 1 boas-vindas → 2 dificuldades de ontem → 3 revisão SRS → 4 conceitos novos
 * → 5 compreensão → 6 repetição oral → 7 jogo → 8 desafio misto
 * → 9 celebração → 10 dicas para os responsáveis.
 *
 * Crianças de 3-4 anos: um bloco por idioma (nunca misturar).
 * Crianças de 5-7 anos: desafio final pode comparar idiomas.
 */
(function (g) {
  'use strict';

  var SRS = (typeof require === 'function' && typeof window === 'undefined')
    ? require('./srs.js') : g.LUMI_SRS;
  var CUR = (typeof require === 'function' && typeof window === 'undefined')
    ? require('../content/curriculum.js') : g.LUMI_CURRICULUM;

  /* Atividades de compreensão disponíveis, alternadas por dia para nunca
   * repetir exatamente a mesma sequência em dias consecutivos. */
  var GAME_POOL = ['find_in_scene', 'missing_image', 'drag_to_target', 'sound_match', 'follow_instruction'];

  function rotate(arr, n) {
    var a = arr.slice();
    for (var i = 0; i < (n % a.length + a.length) % a.length; i++) a.push(a.shift());

    Object.keys(records).forEach(function (k) {
      var r = records[k];
      if (r.lastSeenAt !== null && now - r.lastSeenAt <= twoDays) {

  function pickNewConcepts(records, journeyDay, budget, interests) {
    var pool = CUR.upToDay(journeyDay).filter(function (c) {
      var r = records[c.id];
      return !r || r.state === 'new';

    // Interesses primeiro, mantendo a ordem do currículo dentro de cada grupo.

      var bi = interests && interests.indexOf(b.theme) >= 0 ? 0 : 1;

      .filter(function (id) { return struggles.indexOf(id) < 0; })
      .slice(0, opts.shortened ? 2 : 4);

    { ctx: 'Ao sair de casa', make: function (w, ln) { return 'diga “' + w + '” em ' + ln + ' apontando para o objeto.'; } },

            resolve({ kind: 'listen', result: misses === 0 ? 'ok' : 'helped' });
          });
        } else {
          card.classList.add('faded');
          misses++;
          if (misses >= 2) {
            locked = true;
            var right = wrap.querySelector('[data-id="' + conceptId + '"]');
            if (right) right.classList.add('reveal');
            speakField(env, lang, conceptId, 'word', { slow: true }).then(function () {
              setTimeout(function () { resolve({ kind: 'listen', result: 'hard' }); }, 700);
            });
          } else {
            encourage(env, lang).then(playPrompt);
          }
        }
      }, numOptions);
      container.appendChild(wrap);
      playPrompt();
    });
  }

  /* ---------- atividades ---------- */

  /* Apresentação de conceito novo: imagem grande, áudio, imagens
   * alternativas (aprender o conceito, não a foto), tartaruga = devagar. */
  function present(env, step, container) {
    return new Promise(function (resolve) {
      var c = CUR.get(step.concept);
      var e = entry(env, step.lang, step.concept);
      var images = [c.emoji].concat(c.alts);
      var idx = 0;

      var card = el('div', 'stage-card');
      var img = el('div', 'hero-emoji', images[0]);
      card.appendChild(img);
      card.appendChild(el('div', '', wordLabel(env, e)));
      var dots = el('div', 'alt-dots');
      images.forEach(function (im, i) {
        var d = el('button', 'alt-dot' + (i === 0 ? ' active' : ''), im);
        d.onclick = function () {
          idx = i;
          img.textContent = im;
          dots.querySelectorAll('.alt-dot').forEach(function (x) { x.classList.remove('active'); });
          d.classList.add('active');
          speakField(env, step.lang, step.concept, 'word');
        };
        dots.appendChild(d);
      });
      card.appendChild(dots);
      card.appendChild(replayBar(env, step.lang, step.concept, 'word'));
      container.appendChild(card);

      // artigo quando natural no idioma; senão a palavra
      var field = e && e.art ? 'art' : 'word';
      speakField(env, step.lang, step.concept, field).then(function () {
        return speakField(env, step.lang, step.concept, 'sen');
      }).then(function () {
        container.appendChild(bigNext(function () {
          resolve({ kind: null, result: null });
        }));
      });
    });
  }

  /* Ouça e toque na imagem correta. */
  function listenTap(env, step, container, numOptions) {
    var n = numOptions || (env.profile.age <= 4 ? 3 : 4);
    container.appendChild(el('div', 'task-hint', '👂'));
    var play = function () { speakField(env, step.lang, step.concept, 'word'); };
    return tapChoice(env, step.lang, step.concept, play, container, n);
  }

  /* Ligue o som à imagem: usa a frase, 4 opções. */
  function soundMatch(env, step, container) {
    container.appendChild(el('div', 'task-hint', '🎵'));
    var play = function () { speakField(env, step.lang, step.concept, 'sen'); };
    return tapChoice(env, step.lang, step.concept, play, container, 4);
  }

  /* Siga uma instrução simples (frase de ação). */
  function followInstruction(env, step, container) {
    container.appendChild(el('div', 'task-hint', '🫲'));
    var play = function () { speakField(env, step.lang, step.concept, 'act'); };
    return tapChoice(env, step.lang, step.concept, play, container, 3);
  }

  /* Encontre o objeto no cenário. */
  function findInScene(env, step, container) {
    return new Promise(function (resolve) {
      var target = CUR.get(step.concept);
      var others = distractors(step.concept, 5).map(function (id) { return CUR.get(id); });
      var scene = el('div', 'scene');
      scene.appendChild(el('div', 'scene-bg', target.scene));
      var misses = 0, locked = false;
      shuffle([target].concat(others)).forEach(function (c, i) {
        var b = el('button', 'scene-item pos-' + i, c.emoji);
        b.onclick = function () {
          if (locked) return;
          if (c.id === step.concept) {
            locked = true;
            b.classList.add('correct');
            praiseOverlay(env, step.lang).then(function () {
              resolve({ kind: 'listen', result: misses === 0 ? 'ok' : 'helped' });
            });
          } else {
            b.classList.add('faded');
            misses++;
            if (misses >= 3) {
              locked = true;
              speakField(env, step.lang, step.concept, 'word', { slow: true }).then(function () {
                resolve({ kind: 'listen', result: 'hard' });
              });
            } else {
              encourage(env, step.lang).then(function () { speakField(env, step.lang, step.concept, 'q'); });
            }
          }
        };
        scene.appendChild(b);
      });
      container.appendChild(el('div', 'task-hint', '🔍'));
      container.appendChild(scene);
      speakField(env, step.lang, step.concept, 'q'); // "Onde está …?"
    });
  }

  /* Qual imagem desapareceu? */
  function missingImage(env, step, container) {
    return new Promise(function (resolve) {
      var ids = (step.concepts && step.concepts.length >= 3 ? step.concepts.slice(-3) : [step.concept].concat(distractors(step.concept, 2)));
      ids = shuffle(ids);
      var gone = ids[Math.floor(Math.random() * ids.length)];
      var row = el('div', 'memory-row');
      ids.forEach(function (id) {
        var c = CUR.get(id);
        var card = el('div', 'memory-card', '<span>' + c.emoji + '</span>');
        card.dataset.id = id;
        row.appendChild(card);
      });
      container.appendChild(el('div', 'task-hint', '🙈'));
      container.appendChild(row);

      // fala os nomes, cobre, remove um e pergunta
      var lang = step.lang;
      var chain = Promise.resolve();
      ids.forEach(function (id) {
        chain = chain.then(function () { return speakField(env, lang, id, 'word'); });
      });
      chain.then(function () {
        setTimeout(function () {
          row.querySelectorAll('.memory-card').forEach(function (c) { c.classList.add('covered'); c.innerHTML = '❓'; });
          setTimeout(function () {
            var goneEl = row.querySelector('[data-id="' + gone + '"]');
            if (goneEl) goneEl.remove();
            row.querySelectorAll('.memory-card').forEach(function (c) {
              c.classList.remove('covered');
              c.innerHTML = '<span>' + CUR.get(c.dataset.id).emoji + '</span>';
            });
            tapChoice(env, lang, gone, function () {}, container, 3).then(resolve);
          }, 900);
        }, 1600);
      });
    });
  }

  /* Arraste o objeto para o lugar correto. */
  function dragToTarget(env, step, container) {
    return new Promise(function (resolve) {
      var targetC = CUR.get(step.concept);
      var pool = shuffle([step.concept].concat(distractors(step.concept, 2)));
      container.appendChild(el('div', 'task-hint', '👉'));

      var zone = el('div', 'drop-zone', '<span class="ghost">' + targetC.emoji + '</span>');
      container.appendChild(zone);
      var row = el('div', 'drag-row');
      var misses = 0, done = false;

      pool.forEach(function (id) {
        var c = CUR.get(id);
        var item = el('button', 'drag-item', c.emoji);
        item.style.touchAction = 'none';
        item.addEventListener('pointerdown', function (ev) {
          if (done) return;
          item.setPointerCapture(ev.pointerId);
          var startX = ev.clientX, startY = ev.clientY;
          item.classList.add('dragging');
          function move(e2) {
            item.style.transform = 'translate(' + (e2.clientX - startX) + 'px,' + (e2.clientY - startY) + 'px) scale(1.15)';
          }
          function up(e2) {
            item.removeEventListener('pointermove', move);
            item.removeEventListener('pointerup', up);
            item.classList.remove('dragging');
            var z = zone.getBoundingClientRect();
            var inside = e2.clientX >= z.left && e2.clientX <= z.right && e2.clientY >= z.top && e2.clientY <= z.bottom;
            item.style.transform = '';
            if (!inside) return;
            if (id === step.concept) {
              done = true;
              zone.innerHTML = '<span class="landed">' + c.emoji + '</span>';
              praiseOverlay(env, step.lang).then(function () {
                resolve({ kind: 'listen', result: misses === 0 ? 'ok' : 'helped' });
              });
            } else {
              misses++;
              item.classList.add('faded');
              if (misses >= 2) {
                done = true;
                speakField(env, step.lang, step.concept, 'word', { slow: true }).then(function () {
                  resolve({ kind: 'listen', result: 'hard' });
                });
              } else {
                encourage(env, step.lang).then(function () { speakField(env, step.lang, step.concept, 'word'); });
              }
            }
          }
          item.addEventListener('pointermove', move);
          item.addEventListener('pointerup', up);
        });
        row.appendChild(item);
      });
      container.appendChild(row);
      speakField(env, step.lang, step.concept, 'word');
    });
  }

  /* Ouça e repita — com reconhecimento de voz quando permitido/possível.
   * Sem reconhecimento: fluxo honesto de "repetir junto" (conta como
   * 'repetido com ajuda', nunca como fala verificada). */
  function repeatAloud(env, step, container) {
    return new Promise(function (resolve) {
      var c = CUR.get(step.concept);
      var e = entry(env, step.lang, step.concept);
      var card = el('div', 'stage-card');
      card.appendChild(el('div', 'hero-emoji', c.emoji));
      card.appendChild(el('div', '', wordLabel(env, e)));
      card.appendChild(el('div', 'task-hint', '🗣️'));
      card.appendChild(replayBar(env, step.lang, step.concept, 'word'));
      container.appendChild(card);

      var canListen = env.profile.allowSpeech && SPEECH.available();
      var attempts = 0;

      function finish(result) { resolve({ kind: 'speak', result: result }); }

      function targets() {
        var t = [e.word];
        if (e.syn) t.push(e.syn.replace(/\s*\(.*\)/, ''));
        if (e.rom) t.push(e.rom);
        if (e.var) Object.keys(e.var).forEach(function (k) { t.push(e.var[k]); });
        return t;
      }

      if (canListen) {
        var mic = el('button', 'btn-mic', '🎤');
        mic.setAttribute('aria-label', 'Falar');
        var status = el('div', 'mic-status', '');
        card.appendChild(mic); card.appendChild(status);

        mic.onclick = function () {
          mic.disabled = true;
          mic.classList.add('listening');
          status.textContent = '…';
          SPEECH.listen(env.ttsTag(step.lang), { timeoutMs: 6000 }).then(function (r) {
            mic.classList.remove('listening');
            attempts++;
            if (r.status === 'unavailable') {
              // sem confiança/suporte: não penalizar — cai no fluxo assistido
              fallbackFlow();
              return;
            }
            var grade = r.status === 'heard' ? SPEECH.assess(r.transcript, targets()) : 'try';
            if (grade === 'good') {
              praiseOverlay(env, step.lang).then(function () { finish(attempts === 1 ? 'ok' : 'ok'); });
            } else if (attempts >= 3) {
              // marca silenciosamente para revisão, sem constranger
              AUDIO.speak(ALMOST[step.lang] || ALMOST.pt, env.ttsTag(step.lang))
                .then(function () { finish(grade === 'close' ? 'helped' : 'hard'); });
            } else {
              status.textContent = '';
              AUDIO.speak(ALMOST[step.lang] || ALMOST.pt, env.ttsTag(step.lang))
                .then(function () { return speakField(env, step.lang, step.concept, 'word', { slow: attempts >= 2 }); })
                .then(function () { mic.disabled = false; });
            }
          });
        };
        speakField(env, step.lang, step.concept, 'word').then(function () { mic.disabled = false; });
      } else {
        fallbackFlow();
      }

      function fallbackFlow() {
        // "Repita junto": personagem fala, criança repete em voz alta,
        // um toque confirma que repetiu (sem verificação automática).
        var old = card.querySelector('.btn-mic'); if (old) old.remove();
        var oldS = card.querySelector('.mic-status'); if (oldS) oldS.remove();
        var okBtn = el('button', 'btn-said', '✅');
        okBtn.setAttribute('aria-label', 'Repeti!');
        card.appendChild(okBtn);
        speakField(env, step.lang, step.concept, 'word', { slow: false });
        okBtn.onclick = function () {
          praiseOverlay(env, step.lang).then(function () { finish('helped'); });
        };
      }
    });
  }

  /* Desafio de comparação (5-7 anos): quem falou? */
  function compare(env, step, container) {
    return new Promise(function (resolve) {
      var langs = step.langs;
      var pool = CUR.concepts.filter(function (c) { return c.day <= env.profile.journeyDay; });
      var c = pool.length ? shuffle(pool)[0] : CUR.concepts[0];
      var spoken = langs[Math.floor(Math.random() * langs.length)];

      container.appendChild(el('div', 'task-hint', '👂'));
      container.appendChild(el('div', 'hero-emoji hero-small', c.emoji));
      var row = el('div', 'options options-2');
      var misses = 0, locked = false;
      langs.forEach(function (l) {
        var L = LANGS.get(l);
        var card = el('button', 'option-card char-card',
          '<span class="opt-emoji">' + L.character.emoji + '</span><span class="char-name">' + L.character.name + '</span>');
        card.style.borderColor = L.color;
        card.onclick = function () {
          if (locked) return;
          if (l === spoken) {
            locked = true;
            praiseOverlay(env, spoken).then(function () {
              resolve({ kind: 'listen', result: misses === 0 ? 'ok' : 'helped' });
            });
          } else {
            misses++;
            card.classList.add('faded');
            if (misses >= 2) { locked = true; resolve({ kind: 'listen', result: 'hard' }); }
            else encourage(env, spoken).then(play);
          }
        };
        row.appendChild(card);
      });
      container.appendChild(row);
      function play() { speakField(env, spoken, c.id, 'word'); }
      play();
    });
  }

  /* Vinhetas sem pontuação */
  function welcome(env, step, container) {
    return new Promise(function (resolve) {
      var lang0 = env.profile.langs[0];
      var L = LANGS.get(lang0);
      var card = el('div', 'stage-card welcome-card');
      card.appendChild(el('div', 'hero-emoji bounce', L.character.emoji));
      container.appendChild(card);
      AUDIO.jingle(L.jingle);
      var hello = { pt: 'Olá! Vamos brincar?', en: 'Hello! Let’s play!', de: 'Hallo! Spielen wir!', es: '¡Hola! ¡A jugar!', fr: 'Bonjour ! On joue ?', it: 'Ciao! Giochiamo!', tr: 'Merhaba! Hadi oynayalım!', zh: '你好！我们一起玩吧！', ja: 'こんにちは！あそぼう！' };
      AUDIO.speak(hello[lang0] || hello.pt, env.ttsTag(lang0)).then(function () {
        setTimeout(function () { resolve({ kind: null, result: null }); }, 400);
      });
    });
  }

  function langIntro(env, step, container) {
    return new Promise(function (resolve) {
      var L = LANGS.get(step.lang);
      var card = el('div', 'stage-card lang-intro');
      card.style.background = L.colorSoft;
      card.appendChild(el('div', 'hero-emoji bounce', L.character.emoji));
      card.appendChild(el('div', 'char-name big', L.character.name));
      container.appendChild(card);
      AUDIO.jingle(L.jingle);
      setTimeout(function () { resolve({ kind: null, result: null }); }, 1400);
    });
  }

  function celebrate(env, step, container) {
    return new Promise(function (resolve) {
      var card = el('div', 'stage-card celebrate-card');
      card.appendChild(el('div', 'hero-emoji bounce', '🎉'));
      for (var i = 0; i < 14; i++) {
        var cf = el('div', 'confetti');
        cf.style.left = (5 + Math.random() * 90) + '%';
        cf.style.animationDelay = (Math.random() * 0.8) + 's';
        cf.style.background = ['#F4B400', '#4A6CF7', '#E2574C', '#2BB673', '#8E6CF0'][i % 5];
        card.appendChild(cf);
      }
      container.appendChild(card);
      AUDIO.chimeGood();
      var lang0 = env.profile.langs[0];
      AUDIO.speak(PRAISE[lang0] || PRAISE.pt, env.ttsTag(lang0)).then(function () {
        setTimeout(function () { resolve({ kind: null, result: null }); }, 1200);
      });
    });
  }

  /* Dispatcher */
  function run(step, env, container) {
    container.innerHTML = '';
    var L = step.lang ? LANGS.get(step.lang) : null;
    container.parentElement.style.setProperty('--lang-color', L ? L.color : '#8E6CF0');
    container.parentElement.style.setProperty('--lang-soft', L ? L.colorSoft : '#EAE3FC');

    switch (step.type) {
      case 'welcome': return welcome(env, step, container);
      case 'lang_intro': return langIntro(env, step, container);
      case 'present': return present(env, step, container);
      case 'listen_tap': return listenTap(env, step, container);
      case 'repeat': return repeatAloud(env, step, container);
      case 'review':
        // revisão simplificada volta para reconhecimento visual
        if (step.mode === 'listen') return listenTap(env, step, container, 3);
        return Math.random() < 0.5 ? listenTap(env, step, container) : repeatAloud(env, step, container);
      case 'game':
        switch (step.game) {
          case 'find_in_scene': return findInScene(env, pickGameStep(step), container);
          case 'missing_image': return missingImage(env, pickGameStep(step), container);
          case 'drag_to_target': return dragToTarget(env, pickGameStep(step), container);
          case 'sound_match': return soundMatch(env, pickGameStep(step), container);
          case 'follow_instruction': return followInstruction(env, pickGameStep(step), container);
          default: return listenTap(env, pickGameStep(step), container);
        }
      case 'compare': return compare(env, step, container);
      case 'celebrate': return celebrate(env, step, container);
      default: return Promise.resolve({ kind: null, result: null });
    }
  }

  function pickGameStep(step) {
    var ids = step.concepts && step.concepts.length ? step.concepts : [step.concept];
    return { type: step.type, lang: step.lang, concept: ids[Math.floor(Math.random() * ids.length)], concepts: ids };
  }

  g.LUMI_ACT = { run: run, PRAISE: PRAISE };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* LumiLínguas — Área dos responsáveis: portão parental, onboarding com
 * consentimento, painel de progresso, gravação de voz da família,
 * configurações, exportação e exclusão de dados.
 */
(function (g) {
  'use strict';

  var LANGS = g.LUMI_LANGS, CUR = g.LUMI_CURRICULUM, SRS = g.LUMI_SRS,
      GATE = g.LUMI_GATE, AUDIO = g.LUMI_AUDIO;

  function APP() { return g.LUMI_APP; }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    $(id).classList.add('active');
  }

  var STATE_LABELS = {
    'new': 'ainda não apresentado', presented: 'apresentado',
    recognized: 'reconhece ao ouvir', repeated_helped: 'repete com ajuda',
    spoken: 'fala sem ajuda', mastered: 'dominado', review: 'precisa de revisão'
  };

  /* ---------- Portão parental ---------- */

  function openGate(target) {
    var data = APP().data();
    var modal = $('gate-modal');
    var body = $('gate-body');
    modal.classList.add('open');
    body.innerHTML = '';

    function done() {
      modal.classList.remove('open');
      if (target === 'onboarding') startOnboarding();
      else renderDashboard();
    }

    if (data.parent.pin) {
      body.appendChild(el('p', 'gate-title', 'Área dos responsáveis'));
      body.appendChild(el('p', '', 'Digite o PIN:'));
      var input = el('input', 'gate-input');
      input.type = 'password'; input.inputMode = 'numeric'; input.maxLength = 6;
      body.appendChild(input);
      var msg = el('p', 'gate-msg', '');
      body.appendChild(msg);
      var ok = el('button', 'btn-primary', 'Entrar');
      ok.onclick = function () {
        if (GATE.verifyPin(data.parent.pin, input.value)) done();
        else { msg.textContent = 'PIN incorreto.'; input.value = ''; }
      };
      body.appendChild(ok);
      input.focus();
    } else {
      var ch = GATE.mathChallenge();
      body.appendChild(el('p', 'gate-title', 'Confirmação de adulto'));
      body.appendChild(el('p', '', ch.question));
      var inp2 = el('input', 'gate-input');
      inp2.type = 'number'; inp2.inputMode = 'numeric';
      body.appendChild(inp2);
      var msg2 = el('p', 'gate-msg', '');
      body.appendChild(msg2);
      var ok2 = el('button', 'btn-primary', 'Confirmar');
      ok2.onclick = function () {
        if (Number(inp2.value) === ch.answer) done();
        else { msg2.textContent = 'Tente novamente.'; inp2.value = ''; ch = GATE.mathChallenge(); body.children[1].textContent = ch.question; }
      };
      body.appendChild(ok2);
      inp2.focus();
    }
    $('gate-close').onclick = function () { modal.classList.remove('open'); };
  }

  /* ---------- Onboarding ---------- */

  var draft = null;
  var obStep = 0;

  function startOnboarding() {
    draft = {
      name: '', age: 4, avatar: '🧒', homeLang: 'pt', langs: [], langVariants: {},
      levels: {}, reading: 'no', interests: [], sessionMinutes: 11,
      usualTime: '', allowSpeech: false, allowFamilyVoice: false, textSupport: false
    };
    obStep = 0;
    show('screen-onboarding');
    renderObStep();
  }

  var OB_STEPS = [
    stepWelcome, stepChild, stepHomeLang, stepLangs, stepVariants, stepLevels,
    stepReading, stepInterests, stepRoutine, stepConsent, stepPin, stepMiniTest, stepSummary
  ];

  function renderObStep() {
    var wrap = $('onboarding-body');
    wrap.innerHTML = '';
    $('ob-progress').style.width = Math.round(100 * obStep / (OB_STEPS.length - 1)) + '%';
    OB_STEPS[obStep](wrap);
  }

  function navRow(wrap, canNext, onNext) {
    var row = el('div', 'ob-nav');
    if (obStep > 0) {
      var back = el('button', 'btn-ghost', '← Voltar');
      back.onclick = function () { obStep--; renderObStep(); };
      row.appendChild(back);
    }
    var next = el('button', 'btn-primary', obStep === OB_STEPS.length - 1 ? 'Concluir' : 'Continuar');
    next.disabled = !canNext;
    next.onclick = function () {
      if (onNext && onNext() === false) return;
      obStep++;
      if (obStep >= OB_STEPS.length) finishOnboarding();
      else renderObStep();
    };
    row.appendChild(next);
    wrap.appendChild(row);
    return next;
  }

  function stepWelcome(wrap) {
    wrap.appendChild(el('h2', '', 'Bem-vindo ao LumiLínguas! ✨'));
    wrap.appendChild(el('p', '', 'Construa uma base de compreensão, vocabulário e pronúncia em até quatro idiomas durante uma jornada de 60 dias.'));
    wrap.appendChild(el('p', 'ob-note', 'Este aplicativo não promete fluência em dois meses: promete exposição estruturada, repetida e alegre, com revisões programadas e acompanhamento real do que a criança reconhece e fala.'));
    navRow(wrap, true);
  }

  function stepChild(wrap) {
    wrap.appendChild(el('h2', '', 'Quem vai aprender?'));
    wrap.appendChild(el('label', '', 'Nome ou apelido da criança'));
    var name = el('input', 'ob-input'); name.value = draft.name; name.maxLength = 24;
    wrap.appendChild(name);
    wrap.appendChild(el('label', '', 'Idade'));
    var ageRow = el('div', 'chip-row');
    [3, 4, 5, 6, 7].forEach(function (a) {
      var c = el('button', 'chip' + (draft.age === a ? ' sel' : ''), String(a));
      c.onclick = function () { draft.age = a; renderObStep(); };
      ageRow.appendChild(c);
    });
    wrap.appendChild(ageRow);

  var miniResult = null;
  function stepMiniTest(wrap) {
    wrap.appendChild(el('h2', '', 'Teste inicial (curto e sem pressão)'));
    wrap.appendChild(el('p', 'ob-note', 'Entregue o aparelho à criança: 3 perguntas visuais no primeiro idioma escolhido. Serve só para calibrar o começo. Você pode pular.'));
    var area = el('div', 'minitest-area');
    wrap.appendChild(area);
    var lang = draft.langs[0];
    var qs = ['apple', 'dog', 'water'];
    var i = 0, hits = 0;

    function ask() {
      if (i >= qs.length) {
        miniResult = hits;
        area.innerHTML = '<p class="ob-note">Pronto! ⭐ Obrigado, ' + draft.name + '!</p>';
        return;
      }
      area.innerHTML = '';
      var target = qs[i];
      var opts = [target].concat(CUR.concepts.filter(function (c) { return c.id !== target; }).slice(0, 8)
        .sort(function () { return Math.random() - 0.5; }).slice(0, 2).map(function (c) { return c.id; }))
        .sort(function () { return Math.random() - 0.5; });
      var pack = g.LUMI_PACKS[lang];
      AUDIO.speak(pack.concepts[target].word, APP_TAG(lang));
      var row = el('div', 'options options-3');
      opts.forEach(function (id) {
        var b = el('button', 'option-card', '<span class="opt-emoji">' + CUR.get(id).emoji + '</span>');
        b.onclick = function () {
          if (id === target) hits++;
          i++; ask();
        };
        row.appendChild(b);
      });
      area.appendChild(row);
      var replay = el('button', 'btn-round btn-replay', '🔊');
      replay.onclick = function () { AUDIO.speak(pack.concepts[target].word, APP_TAG(lang)); };
      area.appendChild(replay);
    }
    function APP_TAG(l) {
      return draft.langVariants[l] || LANGS.get(l).tts[0];
    }
    var startB = el('button', 'btn-primary', 'Começar o teste');
    startB.onclick = function () { startB.remove(); ask(); };
    wrap.appendChild(startB);
    navRow(wrap, true);
  }

  /* ---------- Painel dos responsáveis ---------- */

  function renderDashboard() {
    show('screen-parent');

      ['progress', '📊 Progresso'], ['difficulties', '🧩 Dificuldades'], ['sessions', '🕒 Sessões'],

    ];

  function renderTab(tab) {
    var body = $('parent-body');
    body.innerHTML = '';
    var data = APP().data();
    var p = APP().profile();
    if (!p) { body.appendChild(el('p', '', 'Nenhum perfil ativo.')); return; }

    if (tab === 'progress') {
      p.langs.forEach(function (lang) {
        var L = LANGS.get(lang);
        var recs = data.progress[p.id] && data.progress[p.id][lang] || {};
        var counts = {};
        Object.keys(recs).forEach(function (k) { counts[recs[k].state] = (counts[recs[k].state] || 0) + 1; });
        var seen = Object.keys(recs).length;
        var spoken = (counts.spoken || 0) + (counts.mastered || 0);
        var card = el('div', 'pcard');
        card.appendChild(el('h3', '', L.flag + ' ' + L.name));
        var ret = [1, 3, 7, 14, 30].map(function (d) {
          var r = SRS.retentionAt(recs, d);
          return d + 'd: ' + (r === null ? '—' : Math.round(r * 100) + '%');
        }).join(' · ');
        card.appendChild(el('p', '', 'Conceitos vistos: <b>' + seen + '</b> de ' + CUR.concepts.length +
          ' · reconhece ao ouvir: <b>' + ((counts.recognized || 0) + spoken + (counts.repeated_helped || 0)) + '</b>' +
          ' · fala sem ajuda: <b>' + spoken + '</b>'));
        card.appendChild(el('p', 'ob-note', 'Retenção estimada — ' + ret));
        var states = el('p', 'state-line', Object.keys(counts).map(function (s) {
          return STATE_LABELS[s] + ': ' + counts[s];
        }).join(' · ') || 'Ainda sem atividades registradas.');
        card.appendChild(states);
        body.appendChild(card);
      });
      body.appendChild(el('p', 'ob-note', 'Dia da jornada: ' + p.journeyDay + ' de 60 — fase: ' + CUR.weekForDay(p.journeyDay).title));
    }

    if (tab === 'difficulties') {
      p.langs.forEach(function (lang) {
        var recs = data.progress[p.id] && data.progress[p.id][lang] || {};
        var hard = Object.keys(recs).filter(function (k) { return recs[k].state === 'review' || recs[k].struggles > 0; })
          .sort(function (a, b) { return recs[b].struggles - recs[a].struggles; });
        var card = el('div', 'pcard');
        card.appendChild(el('h3', '', LANGS.get(lang).flag + ' ' + LANGS.get(lang).name));
        if (!hard.length) card.appendChild(el('p', '', 'Nenhuma dificuldade no momento. 🎉'));
        hard.slice(0, 8).forEach(function (k) {
          var c = CUR.get(k);
          var e = g.LUMI_PACKS[lang].concepts[k];
          var simplify = SRS.needsSimplification(recs[k]);
          card.appendChild(el('p', '', c.emoji + ' <b>' + e.word + '</b> — ' + STATE_LABELS[recs[k].state] +
            (simplify ? ' · atividade simplificada automaticamente' : '')));
        });
        body.appendChild(card);
      });
    }

    if (tab === 'sessions') {
      var sessions = (data.sessions[p.id] || []).slice().reverse();
      if (!sessions.length) body.appendChild(el('p', '', 'Nenhuma sessão ainda.'));
      var totalMs = 0;
      sessions.forEach(function (s) { totalMs += s.durationMs || 0; });
      body.appendChild(el('p', 'ob-note', 'Tempo total de uso: ' + Math.round(totalMs / 60000) + ' min em ' + sessions.length + ' sessões.'));
      sessions.slice(0, 14).forEach(function (s) {
        var d = new Date(s.date);
        body.appendChild(el('div', 'pcard',
          '<b>Dia ' + s.day + '</b> — ' + d.toLocaleDateString() + ' · ' + Math.round((s.durationMs || 0) / 60000) + ' min · ' +
          s.answered + ' atividades' + (s.hard ? ' · ' + s.hard + ' com apoio extra' : '') + (s.shortened ? ' · sessão encurtada (cansaço)' : '')));
      });
    }

    if (tab === 'tips') {
      var last = (data.sessions[p.id] || []).slice(-1)[0];
      if (!last || !last.tips || !last.tips.length) {
        body.appendChild(el('p', '', 'As dicas do dia aparecem depois da primeira sessão.'));
      } else {
        body.appendChild(el('p', 'ob-note', 'Quatro momentos de hoje — sem virar professor, só brincando:'));
        last.tips.forEach(function (t) { body.appendChild(el('div', 'pcard tip', '💡 ' + t)); });
      }
    }

    if (tab === 'voice') {
      renderVoiceTab(body, p);
    }

    if (tab === 'settings') {
      renderSettingsTab(body, p);
    }

    if (tab === 'dataTab') {
      var card = el('div', 'pcard');
      card.appendChild(el('h3', '', 'Seus dados, suas regras'));
      card.appendChild(el('p', 'ob-note', 'Tudo fica neste aparelho. Nenhum dado é enviado a servidores nesta versão de demonstração.'));
      var exp = el('button', 'btn-primary', '⬇️ Exportar dados do perfil (JSON)');
      exp.onclick = function () {
        var json = APP().store.exportProfile(data, p.id);
        if (g.LUMI_SINGLE_FILE) {
          // demo em arquivo único (sem permissão de download): mostrar p/ copiar
          var ta = el('textarea', 'ob-input');
          ta.value = json; ta.rows = 10; ta.readOnly = true;
          card.appendChild(ta);
          ta.focus(); ta.select();
        } else {
          var blob = new Blob([json], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'lumilinguas-' + p.name + '.json';
          a.click();
        }
      };
      card.appendChild(exp);
      var del = el('button', 'btn-danger', '🗑️ Excluir este perfil e todos os dados');
      del.onclick = function () {
        if (!confirm('Excluir permanentemente o perfil "' + p.name + '", progresso e gravações?')) return;
        AUDIO.deleteRecordings(p.id);
        APP().store.deleteProfile(data, p.id);
        APP().save();
        APP().renderSplash();
      };
      card.appendChild(del);
      body.appendChild(card);

      var prof = el('div', 'pcard');
      prof.appendChild(el('h3', '', 'Perfis'));
      Object.keys(data.profiles).forEach(function (id) {
        var pr = data.profiles[id];
        var row = el('p', '', (pr.avatar || '🧒') + ' ' + pr.name + (id === data.activeProfile ? ' (ativo)' : ''));
        prof.appendChild(row);
      });
      var add = el('button', 'btn-ghost', '+ Adicionar outra criança');
      add.onclick = startOnboarding;
      prof.appendChild(add);
      body.appendChild(prof);
    }
  }

  function renderVoiceTab(body, p) {
    if (!p.allowFamilyVoice) {
      body.appendChild(el('p', '', 'A gravação da voz da família está desativada. Ative nas Configurações.'));
      return;
    }
    var rec = AUDIO.createRecorder();
    if (!rec) {
      body.appendChild(el('p', '', 'Este navegador não permite gravação de áudio.'));
      return;
    }
    body.appendChild(el('p', 'ob-note', 'Grave palavras com a sua voz: quando existir gravação, a criança ouve a família em vez da voz sintética. Tudo fica salvo apenas neste aparelho.'));
    p.langs.forEach(function (lang) {
      var L = LANGS.get(lang);
      var card = el('div', 'pcard');
      card.appendChild(el('h3', '', L.flag + ' ' + L.name));
      CUR.concepts.slice(0, 12).forEach(function (c) {
        var e = g.LUMI_PACKS[lang].concepts[c.id];
        var row = el('div', 'voice-row');
        row.appendChild(el('span', 'voice-word', c.emoji + ' ' + e.word));
        var b = el('button', 'btn-ghost', '⏺️ Gravar');
        var playB = el('button', 'btn-ghost', '▶️');
        playB.style.display = 'none';
        AUDIO.getRecording(p.id, lang, c.id).then(function (blob) {
          if (blob) playB.style.display = '';
        });
        var recording = false;
        b.onclick = function () {
          if (!recording) {
            rec.start().then(function () { recording = true; b.textContent = '⏹️ Parar'; })
              .catch(function () { b.textContent = 'Microfone negado'; });
          } else {
            rec.stop().then(function (blob) {
              recording = false; b.textContent = '⏺️ Regravar';
              if (blob) AUDIO.saveRecording(p.id, lang, c.id, blob).then(function () { playB.style.display = ''; });
            });
          }
        };
        playB.onclick = function () {
          AUDIO.getRecording(p.id, lang, c.id).then(function (blob) { if (blob) AUDIO.playBlob(blob); });
        };
        row.appendChild(b); row.appendChild(playB);
        card.appendChild(row);
      });
      body.appendChild(card);
    });
  }

  function renderSettingsTab(body, p) {

      if (avail) c.onclick = function () {

    var card2 = el('div', 'pcard');
    card2.appendChild(el('h3', '', 'Preferências'));
    [['allowSpeech', 'Reconhecimento de voz nas atividades de fala'],
     ['allowFamilyVoice', 'Gravação da voz da família'],
     ['textSupport', 'Palavras escritas como apoio (5-7 anos)']].forEach(function (opt) {
      var t = el('button', 'chip toggle' + (p[opt[0]] ? ' sel' : ''), (p[opt[0]] ? '✓ ' : '') + opt[1]);
      t.onclick = function () { p[opt[0]] = !p[opt[0]]; APP().save(); renderTab('settings'); };
      card2.appendChild(t);
    });
    card2.appendChild(el('label', '', 'Duração da sessão'));
    var dr = el('div', 'chip-row');
    [[8, '8 min'], [11, '11 min'], [15, '15 min']].forEach(function (opt) {
      var c = el('button', 'chip' + (p.sessionMinutes === opt[0] ? ' sel' : ''), opt[1]);
      c.onclick = function () { p.sessionMinutes = opt[0]; APP().save(); renderTab('settings'); };
      dr.appendChild(c);
    });
    card2.appendChild(dr);
    body.appendChild(card2);

    var card3 = el('div', 'pcard');
    card3.appendChild(el('h3', '', 'Trocar PIN'));
    var pin = el('input', 'ob-input'); pin.type = 'password'; pin.maxLength = 6; pin.placeholder = 'Novo PIN (4-6 números)';
    var okB = el('button', 'btn-ghost', 'Salvar novo PIN');
    okB.onclick = function () {
      var res = GATE.setPin(pin.value);
      if (res) { data.parent.pin = res; APP().save(); okB.textContent = '✓ PIN atualizado'; }
      else okB.textContent = 'PIN inválido — use 4 a 6 números';
    };
    card3.appendChild(pin); card3.appendChild(okB);
    body.appendChild(card3);
  }

  g.LUMI_PARENT = { openGate: openGate, startOnboarding: startOnboarding, renderDashboard: renderDashboard };
})(window);

</script>
  <script>
/* LumiLínguas — Shell do aplicativo: telas, perfis, sessão diária.
 * A área infantil funciona sem leitura: imagens grandes, áudio e toque.
 */
(function (g) {
  'use strict';

  var CUR = g.LUMI_CURRICULUM, LANGS = g.LUMI_LANGS, SRS = g.LUMI_SRS,
      SESSION = g.LUMI_SESSION, AUDIO = g.LUMI_AUDIO, STORE = g.LUMI_STORE,
      ACT = g.LUMI_ACT;

  var store = STORE.createStore();
  var data = store.load();

  function save() { store.save(data); }

  function $(id) { return document.getElementById(id); }

  function show(screenId) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    $(screenId).classList.add('active');
  }

  function profile() { return data.profiles[data.activeProfile] || null; }

  function ttsTag(lang) {
    var p = profile();
    if (p && p.langVariants && p.langVariants[lang]) return p.langVariants[lang];
    var L = LANGS.get(lang);
    return L ? L.tts[0] : lang;
  }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  /* ---------- Splash / seleção de perfil ---------- */

  function renderSplash() {
    var wrap = $('profile-list');
    wrap.innerHTML = '';
    var ids = Object.keys(data.profiles);
    if (!ids.length) {
      $('splash-empty').style.display = 'block';
      wrap.style.display = 'none';
    } else {
      $('splash-empty').style.display = 'none';
      wrap.style.display = 'flex';
      ids.forEach(function (id) {
        var p = data.profiles[id];
        var b = document.createElement('button');
        b.className = 'profile-bubble';
        b.innerHTML = '<span class="pb-emoji">' + (p.avatar || '🧒') + '</span><span class="pb-name">' + p.name + '</span>';
        b.onclick = function () {
          data.activeProfile = id; save();
          goHome();
        };
        wrap.appendChild(b);
      });
    }
    show('screen-splash');
  }

  /* ---------- Casa da criança ---------- */

  function goHome() {
    var p = profile();
    if (!p) return renderSplash();
    var L = LANGS.get(p.langs[0]);
    $('home-char').textContent = L.character.emoji;
    $('home-char-wrap').style.background = L.colorSoft;
    $('home-day-count').textContent = p.journeyDay;
    // adesivos ganhos aparecem como decoração
    $('home-stickers-preview').textContent = (p.stickers || []).slice(-4).map(function (s) { return s.emoji; }).join(' ');
    show('screen-home');
    AUDIO.jingle(L.jingle);
  }

  /* ---------- Mapa da jornada (60 dias) ---------- */

  function renderMap() {
    var p = profile();
    var wrap = $('map-path');
    wrap.innerHTML = '';
    var weekColors = ['#2BB673', '#4A6CF7', '#E2574C', '#F4B400', '#8E6CF0', '#00A3A3', '#E58B2F', '#E2648F', '#3AAE5C'];
    for (var day = 1; day <= 60; day++) {
      var wk = CUR.weekForDay(day);
      var i = CUR.weeks.indexOf(wk);
      var dot = document.createElement('div');
      dot.className = 'map-dot' + (day < p.journeyDay ? ' done' : day === p.journeyDay ? ' current' : '');
      dot.style.setProperty('--wk-color', weekColors[i]);
      if (day < p.journeyDay) dot.textContent = '⭐';
      else if (day === p.journeyDay) dot.textContent = LANGS.get(p.langs[0]).character.emoji;
      else dot.textContent = '';
      wrap.appendChild(dot);
      if (CUR.weeks[i].days[1] === day && day < 60) {
        var badge = document.createElement('div');
        badge.className = 'map-week-badge';
        badge.textContent = ['🏠', '👨‍👩‍👧', '🍎', '🐶', '👕', '🚗', '😊', '💬', '🏆'][i + 1] || '🏆';
        wrap.appendChild(badge);
      }
    }
    show('screen-map');
  }

  /* ---------- Adesivos ---------- */

  function renderStickers() {
    var p = profile();
    var wrap = $('sticker-grid');
    wrap.innerHTML = '';
    (p.stickers || []).forEach(function (s) {
      var d = document.createElement('div');
      d.className = 'sticker';
      d.textContent = s.emoji;
      wrap.appendChild(d);
    });
    if (!(p.stickers || []).length) {
      wrap.innerHTML = '<div class="sticker ghost">⭐</div><div class="sticker ghost">🎈</div><div class="sticker ghost">🌟</div>';
    }
    show('screen-stickers');
  }

  /* ---------- Sessão diária ---------- */

  var running = null;

  function startSession() {
    var p = profile();
    if (!p) return;
    var now = Date.now();
    var recordsByLang = store.recordsByLang(data, p.id);
    var plan = SESSION.buildSession(p, recordsByLang, now);

    running = {
      plan: plan,
      idx: 0,
      startedAt: now,
      stats: { consecutiveHard: 0, answered: 0, hard: 0, totalMs: 0, avgResponseMs: 0 },
      shortened: false,
      results: []
    };
    show('screen-session');
    nextStep();
  }

  function envForActivities() {
    var p = profile();
    return {
      profile: p,
      packs: g.LUMI_PACKS,
      ttsTag: ttsTag,
      textSupport: p.age >= 5 && !!p.textSupport
    };
  }

  function trimForFatigue(steps, fromIdx) {
    // Cansaço detectado: remove jogos/desafios restantes e novos conceitos
    // extras, mantendo só revisões leves e a celebração.
    var kept = steps.slice(0, fromIdx);
    var newSeen = 0;
    for (var i = fromIdx; i < steps.length; i++) {
      var s = steps[i];
      if (s.type === 'game' || s.type === 'compare') continue;
      if (s.type === 'present') { newSeen++; if (newSeen > 1) { // pula o trio present/listen/repeat
          while (i + 1 < steps.length && (steps[i + 1].type === 'listen_tap' || steps[i + 1].type === 'repeat')) i++;
          continue; } }
      kept.push(s);
    }
    if (kept[kept.length - 1].type !== 'celebrate') kept.push({ type: 'celebrate' });
    return kept;
  }

  function nextStep() {
    var r = running;
    if (!r) return;
    if (r.idx >= r.plan.steps.length) return finishSession();

    var step = r.plan.steps[r.idx];
    var t0 = Date.now();
    ACT.run(step, envForActivities(), $('session-stage')).then(function (res) {
      var dt = Date.now() - t0;
      if (res && res.kind) {
        r.stats.answered++;
        r.stats.totalMs += dt;
        r.stats.avgResponseMs = r.stats.totalMs / r.stats.answered;
        if (res.result === 'hard') { r.stats.hard++; r.stats.consecutiveHard++; }
        else r.stats.consecutiveHard = 0;
        applyResult(step, res);
        r.results.push({ step: step, result: res.result, ms: dt });
      }
      // barra de progresso suave (sem números que gerem ansiedade)
      $('session-progress').style.width = Math.round(100 * (r.idx + 1) / r.plan.steps.length) + '%';

      if (!r.shortened && SESSION.shouldShorten(r.stats)) {
        r.shortened = true;
        r.plan.steps = trimForFatigue(r.plan.steps, r.idx + 1);
      }
      r.idx++;
      nextStep();
    });
  }

  function applyResult(step, res) {
    var p = profile();
    if (!step.lang || !step.concept) return;
    var recs = store.records(data, p.id, step.lang);
    var now = Date.now();
    if (!recs[step.concept]) recs[step.concept] = SRS.freshRecord(now);
    var rec = recs[step.concept];
    if (rec.state === 'new') SRS.introduce(rec, now);
    if (res.result) {
      SRS.record(rec, res.kind === 'speak' ? 'speak' : 'listen',
        res.result === 'hard' ? 'hard' : (res.result === 'helped' ? 'helped' : 'ok'), now);
    }
    save();
  }

  function finishSession() {
    var r = running; running = null;
    var p = profile();
    var langNames = {};
    p.langs.forEach(function (l) { langNames[l] = LANGS.get(l).name.toLowerCase(); });
    var tips = SESSION.parentTips(r.plan.newConcepts, g.LUMI_PACKS, langNames, p.journeyDay);

    store.logSession(data, p.id, {
      date: new Date().toISOString(),
      day: p.journeyDay,
      durationMs: Date.now() - r.startedAt,
      answered: r.stats.answered,
      hard: r.stats.hard,
      shortened: r.shortened,
      newConcepts: r.plan.newConcepts,
      tips: tips
    });

    // adesivo do dia: o primeiro conceito novo aprendido (ou estrela)
    var firstNew = null;
    Object.keys(r.plan.newConcepts).some(function (l) {
      if (r.plan.newConcepts[l].length) { firstNew = r.plan.newConcepts[l][0]; return true; }
      return false;
    });
    var emoji = firstNew ? CUR.get(firstNew).emoji : '⭐';
    p.stickers = p.stickers || [];
    if (!p.stickers.some(function (s) { return s.day === p.journeyDay && s.emoji === emoji; })) {
      p.stickers.push({ day: p.journeyDay, emoji: emoji });
    }

    // avança a jornada uma vez por dia de calendário
    var tk = todayKey();
    if (p.lastSessionDate !== tk) {
      p.lastSessionDate = tk;
      if (p.journeyDay < 60) p.journeyDay++;
    }
    save();
    goHome();
  }

  /* ---------- inicialização ---------- */

  function init() {
    // packs personalizados importados pelo painel administrativo
    try {
      var custom = localStorage.getItem('lumilinguas.customPacks');
      if (custom) {
        var packs = JSON.parse(custom);
        Object.keys(packs).forEach(function (code) {
          var base = g.LUMI_PACKS[code] || { lang: code, version: 0, concepts: {} };
          Object.keys(packs[code].concepts || {}).forEach(function (cid) {
            base.concepts[cid] = packs[code].concepts[cid];
          });
          g.LUMI_PACKS[code] = base;
        });
      }
    } catch (e) {}

    if ('serviceWorker' in navigator && location.protocol !== 'file:' && !g.LUMI_SINGLE_FILE) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    $('btn-play').onclick = startSession;
    $('btn-map').onclick = renderMap;
    $('btn-stickers').onclick = renderStickers;
    $('btn-map-back').onclick = goHome;
    $('btn-stickers-back').onclick = goHome;
    $('btn-home-profiles').onclick = renderSplash;
    $('btn-session-exit').onclick = function () {
      AUDIO.stop();
      // exigir gesto de adulto evitaria saídas acidentais; aqui: toque duplo
      running = null;
      goHome();
    };
    $('btn-splash-setup').onclick = function () { g.LUMI_PARENT.openGate('onboarding'); };
    $('btn-home-parent').onclick = function () { g.LUMI_PARENT.openGate('dashboard'); };

    if (!Object.keys(data.profiles).length) renderSplash();
    else renderSplash();
  }

  g.LUMI_APP = {
    init: init,
    data: function () { return data; },
    store: store,
    save: save,
    profile: profile,
    renderSplash: renderSplash,
    goHome: goHome,
    ttsTag: ttsTag
  };

  document.addEventListener('DOMContentLoaded', init);
})(window);

</script>
